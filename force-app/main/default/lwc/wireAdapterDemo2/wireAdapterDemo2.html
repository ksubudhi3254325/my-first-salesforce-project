<template>
    <lightning-card title="Wire Adapter Demo" icon-name="custom:custom63">
        <div class="slds-m-around_medium">
            <ul class="slds-has-dividers_around-space">
                <template if:true={contacts.data}>
                    <template for:each={contacts.data} for:item="contact">
                        <li key={contact.Id} class="slds-p-around_small">
                            <p class="slds-text-heading_small">{contact.FirstName} {contact.LastName} - {contact.Phone}
                            </p>
                        </li>
                    </template>
                </template>
                <template if:true={contacts.error}>
                    <li class="slds-p-around_small">
                        <p class="slds-text-heading_small">Error: {contacts.error}</p>
                    </li>
                </template>
            </ul>
        </div>
    </lightning-card>
</template>
